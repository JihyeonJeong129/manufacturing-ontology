[pytest]
testpaths = tests/unit tests/integration
addopts = -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: requires PostgreSQL 18 + pgvector (see tests/integration/conftest.py)
    mvp: RSW MVP 실제 지식 적재·시연 동작 검증 (tests/mvp, 원본 문서와 임베딩 모델 필요)
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient.
    ignore::DeprecationWarning:rdflib.*
    ignore::DeprecationWarning:pyshacl.*
